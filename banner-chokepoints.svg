<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#12161d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cp-funnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF1493" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF1493" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="cp-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="url(#cp-bg)"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="798" height="118" rx="4" fill="none" stroke="#FF1493" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Funnel / chokepoint visual on the left -->
  <!-- Wide lines narrowing to a point -->
  <g opacity="0.4">
    <line x1="30" y1="15" x2="120" y2="55" stroke="#FF1493" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="30" y1="105" x2="120" y2="65" stroke="#FF1493" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="45" y1="10" x2="120" y2="52" stroke="#FF1493" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="45" y1="110" x2="120" y2="68" stroke="#FF1493" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="60" y1="8" x2="120" y2="50" stroke="#FF1493" stroke-width="0.5" stroke-opacity="0.2"/>
    <line x1="60" y1="112" x2="120" y2="70" stroke="#FF1493" stroke-width="0.5" stroke-opacity="0.2"/>
  </g>

  <!-- Chokepoint dot -->
  <circle cx="130" cy="60" r="4" fill="#FF1493" filter="url(#cp-glow)" opacity="0.9"/>
  <circle cx="130" cy="60" r="8" fill="none" stroke="#FF1493" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="130" cy="60" r="14" fill="none" stroke="#FF1493" stroke-opacity="0.15" stroke-width="0.5"/>

  <!-- Arrow out of chokepoint -->
  <line x1="140" y1="60" x2="170" y2="60" stroke="#FF1493" stroke-width="1.5" stroke-opacity="0.6"/>
  <polygon points="170,56 178,60 170,64" fill="#FF1493" opacity="0.6"/>

  <!-- Sigma symbol -->
  <text x="195" y="67" font-family="'Courier New', monospace" font-size="28" fill="#FF1493" opacity="0.15" font-weight="bold">Σ</text>

  <!-- Project title -->
  <text x="400" y="42" font-family="'Courier New', monospace" font-size="16" fill="#FF1493" text-anchor="middle" font-weight="bold" letter-spacing="2">DETECTION CHOKEPOINTS</text>

  <!-- Subtitle -->
  <text x="400" y="62" font-family="'Courier New', monospace" font-size="11" fill="#e6edf3" text-anchor="middle" opacity="0.7">Land-and-Run  ·  Open-Source Contribution</text>

  <!-- Stats bar -->
  <text x="400" y="82" font-family="'Courier New', monospace" font-size="9" fill="#e6edf3" text-anchor="middle" opacity="0.4">3-tier Sigma rules  ·  7 delivery methods  ·  4 ATT&amp;CK techniques  ·  lab validated</text>

  <!-- Right side decorative elements - detection tiers -->
  <g opacity="0.35">
    <rect x="660" y="25" width="50" height="6" rx="1" fill="#FF1493"/>
    <rect x="675" y="38" width="35" height="6" rx="1" fill="#58A6FF"/>
    <rect x="690" y="51" width="20" height="6" rx="1" fill="#3FB950"/>
    <text x="660" y="72" font-family="'Courier New', monospace" font-size="7" fill="#e6edf3" opacity="0.6">R → H → A</text>
  </g>

  <!-- Terminal prompt accent -->
  <text x="720" y="105" font-family="'Courier New', monospace" font-size="9" fill="#FF1493" opacity="0.2">PR #191 ✓</text>
</svg>
