<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="tg-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1319"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="tg-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF1493" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="tg-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="url(#tg-bg)"/>

  <!-- Border -->
  <rect x="1" y="1" width="798" height="118" rx="4" fill="none" stroke="#58A6FF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- AI neural network nodes on the left -->
  <g opacity="0.35">
    <!-- Layer 1 -->
    <circle cx="45" cy="25" r="3" fill="#58A6FF"/>
    <circle cx="45" cy="50" r="3" fill="#58A6FF"/>
    <circle cx="45" cy="75" r="3" fill="#58A6FF"/>
    <circle cx="45" cy="100" r="3" fill="#58A6FF"/>
    <!-- Layer 2 -->
    <circle cx="90" cy="35" r="3" fill="#BC8CFF"/>
    <circle cx="90" cy="60" r="3" fill="#BC8CFF"/>
    <circle cx="90" cy="85" r="3" fill="#BC8CFF"/>
    <!-- Layer 3 -->
    <circle cx="135" cy="48" r="3" fill="#FF1493"/>
    <circle cx="135" cy="72" r="3" fill="#FF1493"/>
    <!-- Output -->
    <circle cx="175" cy="60" r="4" fill="#FF1493" filter="url(#tg-glow)"/>

    <!-- Connections L1→L2 -->
    <line x1="48" y1="25" x2="87" y2="35" stroke="#58A6FF" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="48" y1="25" x2="87" y2="60" stroke="#58A6FF" stroke-width="0.5" stroke-opacity="0.2"/>
    <line x1="48" y1="50" x2="87" y2="35" stroke="#58A6FF" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="48" y1="50" x2="87" y2="60" stroke="#58A6FF" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="48" y1="75" x2="87" y2="60" stroke="#58A6FF" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="48" y1="75" x2="87" y2="85" stroke="#58A6FF" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="48" y1="100" x2="87" y2="85" stroke="#58A6FF" stroke-width="0.5" stroke-opacity="0.3"/>
    <!-- Connections L2→L3 -->
    <line x1="93" y1="35" x2="132" y2="48" stroke="#BC8CFF" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="93" y1="60" x2="132" y2="48" stroke="#BC8CFF" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="93" y1="60" x2="132" y2="72" stroke="#BC8CFF" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="93" y1="85" x2="132" y2="72" stroke="#BC8CFF" stroke-width="0.5" stroke-opacity="0.3"/>
    <!-- Connections L3→Out -->
    <line x1="138" y1="48" x2="171" y2="60" stroke="#FF1493" stroke-width="0.7" stroke-opacity="0.5"/>
    <line x1="138" y1="72" x2="171" y2="60" stroke="#FF1493" stroke-width="0.7" stroke-opacity="0.5"/>
  </g>

  <!-- Project title -->
  <text x="400" y="40" font-family="'Courier New', monospace" font-size="16" fill="#58A6FF" text-anchor="middle" font-weight="bold" letter-spacing="3">TIDEGLASS</text>

  <!-- Subtitle -->
  <text x="400" y="60" font-family="'Courier New', monospace" font-size="11" fill="#e6edf3" text-anchor="middle" opacity="0.7">Autonomous LLM-Agent Post-Exploitation  ·  Threat Hunt</text>

  <!-- Stats -->
  <text x="400" y="80" font-family="'Courier New', monospace" font-size="9" fill="#e6edf3" text-anchor="middle" opacity="0.4">9 KQL detections  ·  ATT&amp;CK + ATLAS mapped  ·  52 min autonomous kill chain  ·  #1 / 39 analysts</text>

  <!-- Right side - kill chain steps -->
  <g opacity="0.3">
    <text x="650" y="30" font-family="'Courier New', monospace" font-size="7" fill="#58A6FF">IMDS →</text>
    <text x="650" y="42" font-family="'Courier New', monospace" font-size="7" fill="#BC8CFF">Secrets Mgr →</text>
    <text x="650" y="54" font-family="'Courier New', monospace" font-size="7" fill="#FF69B4">Lateral →</text>
    <text x="650" y="66" font-family="'Courier New', monospace" font-size="7" fill="#F0883E">SSH Key →</text>
    <text x="650" y="78" font-family="'Courier New', monospace" font-size="7" fill="#E3B341">Exfil 2.8M</text>
  </g>

  <!-- Score badge -->
  <text x="720" y="105" font-family="'Courier New', monospace" font-size="9" fill="#58A6FF" opacity="0.2">96/100</text>
</svg>
