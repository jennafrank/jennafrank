<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120" role="img" aria-label="QUARTZFANG incident response report banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1410"/><stop offset="1" stop-color="#0a0d12"/></linearGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9ff7a"/><stop offset="1" stop-color="#6f9a12"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="798" height="118" rx="8" fill="url(#bg)" stroke="#b8f53a" stroke-opacity=".45"/>
  <!-- quartz shard / fang motif -->
  <g transform="translate(46,22)" fill="none" stroke-width="1.4">
    <path d="M30 0 L44 18 L38 70 L30 78 L22 70 L16 18 Z" stroke="url(#shard)" fill="#b8f53a" fill-opacity=".08"/>
    <path d="M30 0 L30 78 M16 18 L44 18 M22 70 L38 70" stroke="#b8f53a" stroke-opacity=".35"/>
    <path d="M58 30 L66 42 L62 66 L58 70 L54 66 L50 42 Z" stroke="#b8f53a" stroke-opacity=".6"/>
    <path d="M6 34 L12 44 L9 62 L6 64 L3 62 L0 44 Z" stroke="#b8f53a" stroke-opacity=".4"/>
  </g>
  <line x1="12" y1="104" x2="130" y2="104" stroke="#b8f53a" stroke-opacity=".2"/>
  <text x="70" y="113" fill="#6f7d63" font-family="Menlo,Consolas,monospace" font-size="7" text-anchor="middle" letter-spacing="1">SSRF → ROOT</text>
  <!-- title -->
  <text x="400" y="47" fill="#c6f432" font-family="Menlo,Consolas,'Courier New',monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="6">QUARTZFANG</text>
  <text x="400" y="70" fill="#c9d1d9" font-family="Menlo,Consolas,monospace" font-size="10" text-anchor="middle" letter-spacing="2.5">SSRF TO ROOT · PORTAL TAKEOVER · INCIDENT RESPONSE</text>
  <text x="400" y="92" fill="#6f7d63" font-family="Menlo,Consolas,monospace" font-size="8.5" text-anchor="middle" letter-spacing="1.2">10 findings · 5 KQL detections · 4 hosts · 97 min observed</text>
  <!-- chain -->
  <g font-family="Menlo,Consolas,monospace" font-size="8" text-anchor="end" letter-spacing=".8">
    <text x="776" y="26" fill="#9fb889">PREVIEW SSRF →</text>
    <text x="776" y="39" fill="#9fb889">REDIS → CRON →</text>
    <text x="776" y="52" fill="#9fb889">ROOT SHELL →</text>
    <text x="776" y="65" fill="#9fb889">STOLEN SVC KEYS →</text>
    <text x="776" y="78" fill="#c6f432">UPLOAD ?</text>
    <text x="776" y="108" fill="#e5e7eb" fill-opacity=".25" font-size="7.5">NIST 800-61r3</text>
  </g>
</svg>
