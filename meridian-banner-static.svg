<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d7b"/>
      <stop offset="50%" stop-color="#ff6bb5"/>
      <stop offset="100%" stop-color="#ff2d7b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d7b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2d7b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff2d7b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a3a" stroke-width="0.5"/>
    </pattern>
    <pattern id="topo" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="100" cy="100" r="30" fill="none" stroke="#151530" stroke-width="0.5"/>
      <circle cx="100" cy="100" r="55" fill="none" stroke="#151530" stroke-width="0.5"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="#12122a" stroke-width="0.5"/>
      <circle cx="30" cy="30" r="20" fill="none" stroke="#12122a" stroke-width="0.5"/>
      <circle cx="170" cy="170" r="25" fill="none" stroke="#12122a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#topo)" opacity="0.6"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.3"/>

  <!-- Accent lines -->
  <line x1="0" y1="85" x2="1200" y2="85" stroke="url(#lineGrad)" stroke-width="1"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Corner accents -->
  <path d="M 30 30 L 30 10 L 50 10" fill="none" stroke="#ff2d7b" stroke-width="2" opacity="0.5"/>
  <path d="M 1170 30 L 1170 10 L 1150 10" fill="none" stroke="#ff2d7b" stroke-width="2" opacity="0.5"/>
  <path d="M 30 370 L 30 390 L 50 390" fill="none" stroke="#ff2d7b" stroke-width="2" opacity="0.5"/>
  <path d="M 1170 370 L 1170 390 L 1150 390" fill="none" stroke="#ff2d7b" stroke-width="2" opacity="0.5"/>

  <!-- Decorative hex dots -->
  <circle cx="180" cy="200" r="2" fill="#ff2d7b" opacity="0.3"/>
  <circle cx="220" cy="180" r="1.5" fill="#ff2d7b" opacity="0.2"/>
  <circle cx="980" cy="220" r="2" fill="#ff2d7b" opacity="0.3"/>
  <circle cx="1020" cy="190" r="1.5" fill="#ff2d7b" opacity="0.2"/>
  <circle cx="150" cy="300" r="1" fill="#ff2d7b" opacity="0.15"/>
  <circle cx="1050" cy="130" r="1" fill="#ff2d7b" opacity="0.15"/>

  <!-- Hunt number badge -->
  <rect x="510" y="95" width="180" height="28" rx="14" fill="none" stroke="#ff2d7b" stroke-width="1" opacity="0.6"/>
  <text x="600" y="114" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13" fill="#ff6bb5" text-anchor="middle" letter-spacing="3">HUNT 25</text>

  <!-- Title -->
  <text x="600" y="180" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="800" fill="url(#pinkGlow)" text-anchor="middle" letter-spacing="12" filter="url(#glow)">MERIDIAN</text>

  <!-- Subtitle -->
  <text x="600" y="215" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="14" fill="#8888aa" text-anchor="middle" letter-spacing="2">Web App Intrusion · Patient Portal · Threat Hunt</text>

  <!-- Tech tags -->
  <g transform="translate(600, 250)">
    <rect x="-280" y="-14" width="130" height="28" rx="4" fill="#1a1a35" stroke="#2a2a50" stroke-width="1"/>
    <text x="-215" y="5" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#ff6bb5" text-anchor="middle">Microsoft Sentinel</text>

    <rect x="-135" y="-14" width="55" height="28" rx="4" fill="#1a1a35" stroke="#2a2a50" stroke-width="1"/>
    <text x="-107" y="5" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#ff6bb5" text-anchor="middle">KQL</text>

    <rect x="-65" y="-14" width="130" height="28" rx="4" fill="#1a1a35" stroke="#2a2a50" stroke-width="1"/>
    <text x="0" y="5" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#ff6bb5" text-anchor="middle">MITRE ATT&amp;CK</text>

    <rect x="80" y="-14" width="100" height="28" rx="4" fill="#1a1a35" stroke="#2a2a50" stroke-width="1"/>
    <text x="130" y="5" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#ff6bb5" text-anchor="middle">PEAK/TaHiTI</text>

    <rect x="195" y="-14" width="85" height="28" rx="4" fill="#1a1a35" stroke="#2a2a50" stroke-width="1"/>
    <text x="237" y="5" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#ff6bb5" text-anchor="middle">python-docx</text>
  </g>

  <!-- Stats line -->
  <text x="600" y="300" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#666688" text-anchor="middle" letter-spacing="1">
    12 findings · 11 KQL detections · 23-row kill chain · 73 C2 blocks · 100/100
  </text>

  <!-- Author -->
  <text x="600" y="345" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" fill="#555577" text-anchor="middle" letter-spacing="4">JENNA FRANK</text>

  <!-- Small signal icon left -->
  <g transform="translate(100, 200)" opacity="0.15">
    <path d="M 0 0 L 5 -15 L 10 5 L 15 -25 L 20 0" fill="none" stroke="#ff2d7b" stroke-width="1.5"/>
  </g>

  <!-- Small signal icon right -->
  <g transform="translate(1070, 200)" opacity="0.15">
    <path d="M 0 0 L 5 -15 L 10 5 L 15 -25 L 20 0" fill="none" stroke="#ff2d7b" stroke-width="1.5"/>
  </g>
</svg>