<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="hp-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111518"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="hp-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="url(#hp-bg)"/>

  <!-- Border -->
  <rect x="1" y="1" width="798" height="118" rx="4" fill="none" stroke="#F0883E" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Honeycomb pattern on the left -->
  <g opacity="0.2" stroke="#F0883E" stroke-width="0.8" fill="none">
    <!-- Row 1 -->
    <polygon points="55,18 65,12 75,18 75,30 65,36 55,30"/>
    <polygon points="75,18 85,12 95,18 95,30 85,36 75,30"/>
    <polygon points="95,18 105,12 115,18 115,30 105,36 95,30"/>
    <!-- Row 2 (offset) -->
    <polygon points="45,36 55,30 65,36 65,48 55,54 45,48"/>
    <polygon points="65,36 75,30 85,36 85,48 75,54 65,48"/>
    <polygon points="85,36 95,30 105,36 105,48 95,54 85,48"/>
    <polygon points="105,36 115,30 125,36 125,48 115,54 105,48"/>
    <!-- Row 3 -->
    <polygon points="55,54 65,48 75,54 75,66 65,72 55,66"/>
    <polygon points="75,54 85,48 95,54 95,66 85,72 75,66"/>
    <polygon points="95,54 105,48 115,54 115,66 105,72 95,66"/>
    <!-- Row 4 (offset) -->
    <polygon points="45,72 55,66 65,72 65,84 55,90 45,84"/>
    <polygon points="65,72 75,66 85,72 85,84 75,90 65,84"/>
    <polygon points="85,72 95,66 105,72 105,84 95,90 85,84"/>
    <polygon points="105,72 115,66 125,72 125,84 115,90 105,84"/>
    <!-- Row 5 -->
    <polygon points="55,90 65,84 75,90 75,102 65,108 55,102"/>
    <polygon points="75,90 85,84 95,90 95,102 85,108 75,102"/>
    <polygon points="95,90 105,84 115,90 115,102 105,108 95,102"/>
  </g>

  <!-- Highlight one cell (the "trap") -->
  <polygon points="75,54 85,48 95,54 95,66 85,72 75,66" fill="#F0883E" opacity="0.15" stroke="#F0883E" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="85" cy="60" r="3" fill="#F0883E" filter="url(#hp-glow)" opacity="0.7"/>

  <!-- Tiny connection lines radiating from trap cell -->
  <g stroke="#F0883E" stroke-width="0.5" opacity="0.25">
    <line x1="95" y1="60" x2="155" y2="40"/>
    <line x1="95" y1="60" x2="155" y2="55"/>
    <line x1="95" y1="60" x2="155" y2="70"/>
    <line x1="95" y1="60" x2="155" y2="85"/>
  </g>

  <!-- Incoming "attacker" dots -->
  <g>
    <circle cx="155" cy="40" r="2" fill="#FF1493" opacity="0.5"/>
    <circle cx="155" cy="55" r="2" fill="#FF1493" opacity="0.4"/>
    <circle cx="155" cy="70" r="2" fill="#FF1493" opacity="0.6"/>
    <circle cx="155" cy="85" r="2" fill="#FF1493" opacity="0.3"/>
  </g>

  <!-- Project title -->
  <text x="400" y="40" font-family="'Courier New', monospace" font-size="16" fill="#F0883E" text-anchor="middle" font-weight="bold" letter-spacing="2">SABLE SAINT-CLAIRE &amp; THE HONEYPOTS</text>

  <!-- Subtitle -->
  <text x="400" y="60" font-family="'Courier New', monospace" font-size="11" fill="#e6edf3" text-anchor="middle" opacity="0.7">SSH Honeypot  ·  Solana Validator Decoy  ·  Live Threat Research</text>

  <!-- Stats -->
  <text x="400" y="80" font-family="'Courier New', monospace" font-size="9" fill="#e6edf3" text-anchor="middle" opacity="0.4">141K sessions  ·  6,145 IPs  ·  414K commands  ·  146 days  ·  17 Easter eggs</text>

  <!-- Right side - signal visualization -->
  <g opacity="0.3" transform="translate(660, 20)">
    <!-- Mini activity bars like a signal meter -->
    <rect x="0" y="60" width="4" height="15" rx="1" fill="#F0883E"/>
    <rect x="8" y="50" width="4" height="25" rx="1" fill="#F0883E"/>
    <rect x="16" y="55" width="4" height="20" rx="1" fill="#F0883E"/>
    <rect x="24" y="35" width="4" height="40" rx="1" fill="#FF1493"/>
    <rect x="32" y="45" width="4" height="30" rx="1" fill="#F0883E"/>
    <rect x="40" y="20" width="4" height="55" rx="1" fill="#FF1493"/>
    <rect x="48" y="40" width="4" height="35" rx="1" fill="#F0883E"/>
    <rect x="56" y="30" width="4" height="45" rx="1" fill="#FF1493"/>
    <rect x="64" y="50" width="4" height="25" rx="1" fill="#F0883E"/>
    <rect x="72" y="55" width="4" height="20" rx="1" fill="#F0883E"/>
    <text x="38" y="-2" font-family="'Courier New', monospace" font-size="7" fill="#e6edf3" opacity="0.5" text-anchor="middle">live telemetry</text>
  </g>

  <!-- Port label -->
  <text x="720" y="105" font-family="'Courier New', monospace" font-size="9" fill="#F0883E" opacity="0.2">:22 open</text>
</svg>
